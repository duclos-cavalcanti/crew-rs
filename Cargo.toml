[package]
name = "crew-rs"
version = "0.1.0"
edition = "2021"
description = "Minimal ratatui seed for a Rust port of `crew` — a live TUI over registered agent sessions. For now: one draw/poll loop rendering a centered square."
license = "MIT"

[[bin]]
name = "crew-rs"
path = "src/main.rs"

# Standalone crate — its own workspace root (empty [workspace] table).
[workspace]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
